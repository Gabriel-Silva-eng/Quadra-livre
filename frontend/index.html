<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuadraLivre - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>QuadraLivre</h1>
            <p>Agendamento rápido de quadras públicas.</p>
        </header>

        <!-- Container para mensagens de erro anunciadas por leitores de tela -->
        <div id="mensagem-status" aria-live="polite" class="status-escondido"></div>

        <section id="sessao-login">
            <h2>Entrar</h2>
            <form id="form-login">
                <div class="grupo-input">
                    <label for="login-email">E-mail</label>
                    <input type="email" id="login-email" name="username" required aria-required="true">
                </div>
                <div class="grupo-input">
                    <label for="login-senha">Senha</label>
                    <input type="password" id="login-senha" name="password" required aria-required="true">
                </div>
                <button type="submit" class="btn-primario">Acessar Sistema</button>
            </form>
            <p>Não tem conta? <button type="button" id="btn-mostrar-cadastro" class="btn-link">Cadastre-se aqui</button></p>
        </section>

        <section id="sessao-cadastro" class="escondido">
            <h2>Novo Cadastro</h2>
            <form id="form-cadastro">
                <div class="grupo-input">
                    <label for="cadastro-nome">Nome Completo</label>
                    <input type="text" id="cadastro-nome" required aria-required="true">
                </div>
                <div class="grupo-input">
                    <label for="cadastro-email">E-mail</label>
                    <input type="email" id="cadastro-email" required aria-required="true">
                </div>
                <div class="grupo-input">
                    <label for="cadastro-senha">Senha</label>
                    <input type="password" id="cadastro-senha" required aria-required="true">
                </div>
                <button type="submit" class="btn-primario">Criar Conta</button>
            </form>
            <p>Já possui conta? <button type="button" id="btn-mostrar-login" class="btn-link">Voltar ao Login</button></p>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
